<!DOCTYPE html>
<html lang="en">
<head>
    <title>Auth - Leveling Together</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
        <div class="logo-icon" style="margin: 0 auto 20px auto; width: 40px; height: 40px; font-size: 1.5rem;">⚡</div>
        <h2>Sign In / Sign Up</h2>
        
        <!-- NEW: Sleek Error Display -->
        {% if error %}
            <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #EF4444; color: #EF4444; padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 0.9rem;">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/auth" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <select name="action" class="btn-green" style="background: var(--bg-dark); color: white; border: 1px solid var(--border-color);">
                <option value="login">I have an account (Login)</option>
                <option value="register">I am new (Sign Up)</option>
            </select>
            
            <!-- NEW: Changed type="email" to type="text" so it accepts both -->
            <input type="text" name="email" placeholder="Email or Username" required>
            
            <input type="text" name="username" placeholder="Username (For Sign Up only)">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-green" style="margin-top: 10px;">Continue</button>
        </form>
    </div>
</body>
</html>
